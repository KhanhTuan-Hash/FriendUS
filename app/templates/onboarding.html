{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h2 class="mb-4">Welcome to FRIENDUS!</h2>
            <p class="lead mb-5">Tell us what you are interested in to personalize your experience.</p>

            <form method="POST" action="{{ url_for('auth.onboarding') }}" id="onboardingForm">
                <input type="hidden" name="interests" id="selectedInterestsInput">
                
                <div class="d-flex flex-wrap justify-content-center gap-3 mb-5" id="tagsContainer">
                    <button type="button" class="btn btn-outline-primary btn-lg interest-tag" data-value="Travel">Travel ✈️</button>
                    <button type="button" class="btn btn-outline-primary btn-lg interest-tag" data-value="Food">Food 🍜</button>
                    <button type="button" class="btn btn-outline-primary btn-lg interest-tag" data-value="Music">Music 🎵</button>
                    <button type="button" class="btn btn-outline-primary btn-lg interest-tag" data-value="Sports">Sports ⚽</button>
                    <button type="button" class="btn btn-outline-primary btn-lg interest-tag" data-value="Technology">Technology 💻</button>
                    <button type="button" class="btn btn-outline-primary btn-lg interest-tag" data-value="Cafe">Cafe ☕</button>
                    <button type="button" class="btn btn-outline-primary btn-lg interest-tag" data-value="Nightlife">Nightlife 🥂</button>
                    <button type="button" class="btn btn-outline-primary btn-lg interest-tag" data-value="Nature">Nature 🌳</button>
                </div>

                <button type="submit" class="btn btn-success btn-lg px-5">Get Started</button>
            </form>
            
            <div class="mt-3">
                <a href="{{ url_for('auth.logout') }}" class="text-muted">Logout</a>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const buttons = document.querySelectorAll('.interest-tag');
    const hiddenInput = document.getElementById('selectedInterestsInput');
    let selectedTags = [];

    buttons.forEach(btn => {
        btn.addEventListener('click', function() {
            const value = this.getAttribute('data-value');

            if (this.classList.contains('active')) {
                // Nếu đang chọn -> Bỏ chọn
                this.classList.remove('active', 'btn-primary');
                this.classList.add('btn-outline-primary');
                // Xóa khỏi mảng
                selectedTags = selectedTags.filter(item => item !== value);
            } else {
                // Nếu chưa chọn -> Chọn
                this.classList.add('active', 'btn-primary');
                this.classList.remove('btn-outline-primary');
                // Thêm vào mảng
                if (!selectedTags.includes(value)) {
                    selectedTags.push(value);
                }
            }

            // Cập nhật giá trị vào input ẩn (dạng "Travel,Food,Music")
            hiddenInput.value = selectedTags.join(',');
            console.log("Current selection:", hiddenInput.value); // Debug
        });
    });
    
    // Validate trước khi submit (bắt buộc chọn ít nhất 1)
    document.getElementById('onboardingForm').addEventListener('submit', function(e) {
        if (selectedTags.length === 0) {
            e.preventDefault();
            alert('Please select at least one interest!');
        }
    });
});
</script>

<style>
    /* CSS thêm một chút hiệu ứng */
    .interest-tag {
        border-radius: 50px;
        padding: 10px 25px;
        transition: all 0.3s;
    }
    .interest-tag.active {
        transform: scale(1.05);
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
</style>
{% endblock %}
